[package]
name = "qr-wifi-gui"
description = "Tauri desktop GUI for QR Wi-Fi."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["wifi", "qr-code", "gui", "desktop", "tauri"]
categories = ["gui"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
qr-wifi-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tiny_http = "0.12"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.2"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.62", features = ["Win32_System_Com"] }

[features]
# Used for production builds / when no dev server is set. DO NOT REMOVE.
custom-protocol = ["tauri/custom-protocol"]
