[package]
name = "qr-wifi-gui"
description = "Tauri desktop GUI for QR Wi-Fi."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["wifi", "qr-code", "gui", "desktop", "tauri"]
categories = ["gui"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
qr-wifi-core = { workspace = true }
serde = { workspace = true }
tiny_http = "0.12"

[features]
# Used for production builds / when no dev server is set. DO NOT REMOVE.
custom-protocol = ["tauri/custom-protocol"]
