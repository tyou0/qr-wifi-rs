[package]
name = "qr-wifi-core"
description = "Cross-platform core for QR Wi-Fi: OS-level Wi-Fi adapters, QR build/decode, and the IPC protocol shared by the CLI/TUI/GUI and the browser-extension host."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["wifi", "qr-code", "network", "cross-platform", "ipc"]
categories = ["network-programming", "os", "encoding"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
qrcode = { workspace = true }
image = { workspace = true }
base64 = { workspace = true }
rqrr = { workspace = true }
rxing = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_WiFi", "Win32_NetworkManagement_Ndis"] }
quick-xml = { version = "0.41", features = ["serialize"] }

[dev-dependencies]
# Pure-logic unit tests live inside each module; no extra dev-deps required.
serde_json = { workspace = true }
quick-xml = { version = "0.41", features = ["serialize"] }
