[package]
name = "qr-wifi-cli"
description = "Command-line interface for QR Wi-Fi. No flags opens the interactive menu."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["wifi", "qr-code", "cli", "network", "cross-platform"]
categories = ["command-line-utilities"]

[[bin]]
name = "qr-wifi"
path = "src/main.rs"

[dependencies]
qr-wifi-core = { workspace = true }
qr-wifi-tui = { workspace = true }
clap = { workspace = true }
