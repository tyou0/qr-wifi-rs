<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Wi-Fi RS</title>
    <style>
      :root {
        color-scheme: light dark;
        --page: #efefeb;
        --surface: #ffffff;
        --surface-soft: #f7f7f3;
        --ink: #0a0a0a;
        --muted: #64645f;
        --line: #c9c9c2;
        --line-strong: #0a0a0a;
        --action: #0a0a0a;
        --action-text: #ffffff;
        --grid-line: rgba(10, 10, 10, 0.045);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: #080808;
          --surface: #111111;
          --surface-soft: #181818;
          --ink: #f4f4ef;
          --muted: #a5a59f;
          --line: #383836;
          --line-strong: #f4f4ef;
          --action: #f4f4ef;
          --action-text: #080808;
          --grid-line: rgba(255, 255, 255, 0.04);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 380px;
        margin: 0;
        padding: 14px;
        background-color: var(--page);
        background-image:
          linear-gradient(var(--grid-line) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
        background-size: 20px 20px;
        color: var(--ink);
        font-family: "Avenir Next", "Century Gothic", "Trebuchet MS", sans-serif;
      }

      h1 {
        margin: 0;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, serif;
        font-size: 1.15rem;
        letter-spacing: -0.035em;
      }

      h2 {
        margin: 0 0 8px;
        color: var(--ink);
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--line);
      }

      .pill {
        padding: 3px 8px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        color: var(--ink);
        font-size: 0.64rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 3px;
        margin-bottom: 10px;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: var(--surface-soft);
      }

      .tab {
        margin: 0;
        padding: 7px 8px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        font-size: 0.72rem;
      }

      .tab.active {
        border-color: var(--surface);
        background: var(--surface);
        color: var(--ink);
        box-shadow: 0 1px 5px rgba(0, 0, 0, 0.12);
      }

      .panel {
        display: none;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
      }

      .panel.active {
        display: block;
        animation: panel-enter 160ms ease-out both;
      }

      label {
        display: block;
        margin: 8px 0 4px;
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 700;
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 8px 9px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface-soft);
        color: var(--ink);
        font: inherit;
        font-size: 0.78rem;
      }

      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--line-strong);
        outline-offset: 2px;
      }

      textarea {
        min-height: 58px;
        resize: vertical;
      }

      button {
        width: 100%;
        margin-top: 9px;
        padding: 9px;
        border: 1px solid var(--action);
        border-radius: 9px;
        background: var(--action);
        color: var(--action-text);
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        transition: transform 140ms ease, background-color 140ms ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(1px);
      }

      button.secondary {
        border: 1px solid var(--line);
        background: var(--surface-soft);
        color: var(--ink);
      }

      button.inline {
        margin-top: 0;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.76rem;
      }

      .check input {
        width: auto;
        accent-color: var(--action);
      }

      #status {
        min-height: 18px;
        margin: 0 0 10px;
        padding-left: 8px;
        border-left: 2px solid var(--line);
        color: var(--muted);
        font-size: 0.74rem;
      }

      #status.error {
        border-color: var(--line-strong);
        color: var(--ink);
        font-weight: 700;
      }

      #qr {
        margin-top: 12px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
      }

      #qr-image {
        display: block;
        width: 210px;
        height: 210px;
        object-fit: contain;
        margin: 0 auto 8px;
        padding: 7px;
        border: 1px solid #000000;
        border-radius: 7px;
        background: #ffffff;
      }

      code {
        display: block;
        color: var(--ink);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 0.68rem;
        white-space: pre-wrap;
        word-break: break-all;
      }

      .hint {
        margin: 7px 0 0;
        color: var(--muted);
        font-size: 0.68rem;
        line-height: 1.4;
      }

      @keyframes panel-enter {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="top">
      <h1>QR Wi-Fi RS</h1>
      <span class="pill">native host</span>
    </div>
    <div id="status">Ready</div>

    <div class="tabs" role="tablist" aria-label="QR Wi-Fi actions">
      <button class="tab active" data-tab="share" type="button">Share</button>
      <button class="tab" data-tab="custom" type="button">Custom</button>
      <button class="tab" data-tab="connect" type="button">Connect</button>
    </div>

    <section id="share" class="panel active">
      <h2>Share saved Wi-Fi</h2>
      <button id="share-current" type="button">Share current connection</button>
      <div class="row">
        <button id="load-networks" class="secondary inline" type="button">Load SSIDs</button>
        <button id="share-selected" class="secondary inline" type="button">Share selected</button>
      </div>
      <label for="ssid-list">Saved / visible SSIDs</label>
      <select id="ssid-list"><option value="">Load networks first</option></select>
      <p class="hint">Browser extension asks `qr-wifi-host`; host reads OS credentials through shared Rust core.</p>
    </section>

    <section id="custom" class="panel">
      <h2>Create custom QR</h2>
      <label for="custom-ssid">SSID</label>
      <input id="custom-ssid" autocomplete="off" placeholder="Guest Wi-Fi" />
      <div class="row">
        <div>
          <label for="custom-security">Security</label>
          <select id="custom-security">
            <option value="WPA">WPA</option>
            <option value="WPA2">WPA2</option>
            <option value="WPA3">WPA3</option>
            <option value="WEP">WEP</option>
            <option value="nopass">Open / nopass</option>
          </select>
        </div>
        <div>
          <label for="custom-password">Password</label>
          <input id="custom-password" type="password" autocomplete="off" placeholder="optional" />
        </div>
      </div>
      <label class="check"><input id="custom-hidden" type="checkbox" /> Hidden network</label>
      <button id="share-custom" type="button">Create QR</button>
    </section>

    <section id="connect" class="panel">
      <h2>Connect from QR</h2>
      <label for="payload-input">Paste WIFI: payload</label>
      <textarea id="payload-input" placeholder="WIFI:T:WPA;S:...;P:...;;"></textarea>
      <button id="connect-payload" type="button">Connect from payload</button>
      <label for="qr-file">Or choose QR image</label>
      <input id="qr-file" type="file" accept="image/png,image/jpeg,image/webp,image/*" />
      <button id="connect-image" class="secondary" type="button">Decode image and connect</button>
    </section>

    <div id="qr" hidden>
      <img id="qr-image" alt="Generated Wi-Fi QR code" />
      <code id="payload"></code>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
