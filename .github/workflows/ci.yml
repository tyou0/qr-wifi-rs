name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: windows-latest
            label: windows-x86_64
          - os: macos-latest
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy default workspace crates
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test default workspace crates
        run: cargo test --locked

      - name: Check Tauri GUI crate
        run: cargo check --locked -p qr-wifi-gui

  packaging:
    name: Packaging and extension checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check camera scanner contract
        run: node scripts/test-camera-scanner.mjs

      - name: Check release packaging contract
        run: scripts/test-release-packaging.sh

      - name: Check Homebrew formula syntax
        run: |
          ruby -c Formula/qr-wifi-rs.rb
          ruby -c scripts/homebrew-formula.rb

      - name: Test native host installer
        run: |
          sh -n scripts/install-native-host.sh
          sh -n scripts/test-install-native-host.sh
          sh scripts/test-install-native-host.sh

      - name: Lint Chrome and Firefox extension
        run: npx --yes web-ext@8.10.0 lint --source-dir extension --warnings-as-errors

  dependency-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit
