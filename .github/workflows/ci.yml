name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: windows-latest
            label: windows-x86_64
          - os: macos-latest
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy all workspace crates, including the desktop GUI
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test default workspace crates
        run: cargo test --locked

      - name: Test combined installation and upgrades
        run: python scripts/test-combined-install.py

      - name: Check Tauri GUI crate
        run: cargo check --locked -p qr-wifi-gui

      - name: Test Tauri command contracts
        run: cargo test --locked -p qr-wifi-gui

  msrv:
    name: Minimum Rust version (1.88)
    runs-on: ubuntu-latest
    container: rust:1.88-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test default workspace crates on the minimum Rust version
        run: cargo test --locked

      - name: Install NetworkManager fixture dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends network-manager dbus

      - name: Test native NetworkManager profiles and connection completion
        run: bash scripts/test-linux-nmcli.sh

  packaging:
    name: Packaging checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check camera scanner contract
        run: node scripts/test-camera-scanner.mjs

      - name: Check frontend console contract
        run: node scripts/test-frontend-console.mjs

      - name: Check release packaging contract
        run: scripts/test-release-packaging.sh

      - name: Check Homebrew formula syntax
        run: |
          ruby -c Formula/qr-wifi-rs.rb
          ruby -c scripts/homebrew-formula.rb

  dependency-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit
