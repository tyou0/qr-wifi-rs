name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  cli-artifacts:
    name: CLI/TUI/host artifact (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --locked -p qr-wifi-cli -p qr-wifi-tui -p qr-wifi-host

      - name: Package release binaries
        shell: bash
        run: |
          set -euo pipefail
          package="qr-wifi-rs-${{ matrix.target }}"
          mkdir -p "dist/$package"

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp target/release/qr-wifi.exe "dist/$package/"
            cp target/release/qr-wifi-tui.exe "dist/$package/"
            cp target/release/qr-wifi-host.exe "dist/$package/"
          else
            cp target/release/qr-wifi "dist/$package/"
            cp target/release/qr-wifi-tui "dist/$package/"
            cp target/release/qr-wifi-host "dist/$package/"
          fi

          cp README.md "dist/$package/"
          if [[ -f LICENSE ]]; then cp LICENSE "dist/$package/"; fi
          tar -czf "dist/$package.tar.gz" -C dist "$package"

      - name: Upload CLI/TUI/host artifact
        uses: actions/upload-artifact@v4
        with:
          name: qr-wifi-rs-${{ matrix.target }}
          path: dist/*.tar.gz

  macos-desktop:
    name: macOS desktop bundle
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "^2"

      - name: Build macOS app and DMG
        run: cargo tauri build --bundles app,dmg

      - name: Package macOS app bundle
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "target/release/bundle/macos/QR Wi-Fi RS.app" "dist/QR-Wi-Fi-RS-macos-app.zip"
          cp target/release/bundle/dmg/*.dmg dist/

      - name: Upload macOS desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: qr-wifi-rs-macos-desktop
          path: dist/*

  publish-github-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli-artifacts, macos-desktop]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
