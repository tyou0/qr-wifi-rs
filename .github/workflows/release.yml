name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  cli-artifacts:
    name: CLI/TUI/host (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: windows-latest
            target: windows-x86_64
          - os: macos-latest
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --locked -p qr-wifi-cli -p qr-wifi-tui -p qr-wifi-host

      - name: Package release binaries
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package="qr-wifi-rs-cli-${version}-${{ matrix.target }}"
          mkdir -p "dist/$package"

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp target/release/qr-wifi.exe "dist/$package/"
            cp target/release/qr-wifi-tui.exe "dist/$package/"
            cp target/release/qr-wifi-host.exe "dist/$package/"
          else
            cp target/release/qr-wifi "dist/$package/"
            cp target/release/qr-wifi-tui "dist/$package/"
            cp target/release/qr-wifi-host "dist/$package/"
          fi

          cp README.md "dist/$package/"
          if [[ -f LICENSE ]]; then cp LICENSE "dist/$package/"; fi
          tar -czf "dist/$package.tar.gz" -C dist "$package"

      - name: Upload CLI/TUI/host artifact
        uses: actions/upload-artifact@v7
        with:
          name: qr-wifi-rs-cli-${{ github.ref_name }}-${{ matrix.target }}
          path: dist/*.tar.gz

  desktop-artifacts:
    name: Desktop bundle (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
            bundles: appimage,deb,rpm
          - os: windows-latest
            target: windows-x86_64
            bundles: nsis,msi
          - os: macos-latest
            target: macos-arm64
            bundles: app,dmg
          - os: macos-15-intel
            target: macos-x86_64
            bundles: app,dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm xvfb desktop-file-utils
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64

      - name: Build terminal tools for combined installer
        run: cargo build --release --locked -p qr-wifi-cli -p qr-wifi-tui -p qr-wifi-host

      - name: Verify Rust and desktop contracts before release
        run: |
          cargo test --locked
          cargo test --locked -p qr-wifi-gui

      - name: Build desktop bundles
        # Use the official prebuilt CLI; app binaries still compile on native runners.
        run: npx --yes @tauri-apps/cli@2.11.4 build --ci --bundles "${{ matrix.bundles }}" -- --locked

      - name: Test combined installation and upgrades
        run: python scripts/test-combined-install.py

      - name: Package combined installer
        shell: bash
        run: |
          version=$(python -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          bash scripts/package-suite.sh "$version" "${{ matrix.target }}"
          # Relative paths also work with Git Bash's tar on Windows.
          mkdir -p target/combined-extracted
          tar -xzf "dist/qr-wifi-rs-${version}-${{ matrix.target }}.tar.gz" -C target/combined-extracted

      - name: Smoke test Unix combined archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          suite=(target/combined-extracted/*)
          bash "${suite[0]}/install.sh" --prefix "$RUNNER_TEMP/combined-installed" --applications-dir "$RUNNER_TEMP/Applications"
          "$RUNNER_TEMP/combined-installed/bin/qr-wifi" --help
          test -x "$RUNNER_TEMP/combined-installed/bin/qr-wifi-tui"
          if [[ "$RUNNER_OS" == Linux ]]; then
            desktop-file-validate "$RUNNER_TEMP/combined-installed/share/applications/com.thetomyou.qrwifirs.desktop"
            xvfb-run -a bash -c '"$RUNNER_TEMP/combined-installed/bin/qr-wifi-gui" & app=$!; sleep 5; kill -0 "$app"; result=$?; kill "$app" 2>/dev/null || true; exit "$result"'
          fi

      - name: Smoke test Windows combined archive (PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $suite = Get-ChildItem 'target\combined-extracted' -Directory | Select-Object -First 1
          & "$($suite.FullName)\install.ps1" -InstallDirectory "$env:RUNNER_TEMP\combined-installed" -ShortcutDirectory "$env:RUNNER_TEMP\shortcuts" -NoPathUpdate
          & "$env:RUNNER_TEMP\combined-installed\bin\qr-wifi.exe" --help
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI failed.' }
          $app = Start-Process "$env:RUNNER_TEMP\combined-installed\bin\qr-wifi-gui.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($app.HasExited) { throw 'Installed desktop app exited unexpectedly.' }
          Stop-Process -Id $app.Id

      - name: Verify ad-hoc macOS signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 "target/release/bundle/macos/QR Wi-Fi RS.app"

      - name: Collect uniquely named desktop artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          copy_one() {
            local pattern=$1
            local destination=$2
            local matches=()
            while IFS= read -r match; do
              matches+=("$match")
            done < <(compgen -G "$pattern" || true)
            if [[ ${#matches[@]} -ne 1 ]]; then
              printf 'Expected exactly one artifact for %s; found %s\n' "$pattern" "${#matches[@]}" >&2
              exit 1
            fi
            cp "${matches[0]}" "$destination"
          }

          case "$RUNNER_OS" in
            Linux)
              copy_one 'target/release/bundle/deb/*.deb' "dist/qr-wifi-rs-desktop-${version}-${{ matrix.target }}.deb"
              copy_one 'target/release/bundle/appimage/*.AppImage' "dist/qr-wifi-rs-desktop-${version}-${{ matrix.target }}.AppImage"
              copy_one 'target/release/bundle/rpm/*.rpm' "dist/qr-wifi-rs-desktop-${version}-${{ matrix.target }}.rpm"
              ;;
            Windows)
              copy_one 'target/release/bundle/nsis/*.exe' "dist/qr-wifi-rs-desktop-${version}-${{ matrix.target }}-setup.exe"
              copy_one 'target/release/bundle/msi/*.msi' "dist/qr-wifi-rs-desktop-${version}-${{ matrix.target }}.msi"
              ;;
            macOS)
              ditto -c -k --sequesterRsrc --keepParent \
                "target/release/bundle/macos/QR Wi-Fi RS.app" \
                "dist/qr-wifi-rs-desktop-${version}-${{ matrix.target }}.app.zip"
              copy_one 'target/release/bundle/dmg/*.dmg' "dist/qr-wifi-rs-desktop-${version}-${{ matrix.target }}.dmg"
              ;;
          esac

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: qr-wifi-rs-desktop-${{ github.ref_name }}-${{ matrix.target }}
          path: dist/*

  extension-artifact:
    name: Browser extension package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint extension
        run: npx --yes web-ext@8.10.0 lint --source-dir extension --warnings-as-errors

      - name: Package unsigned extension
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          npx --yes web-ext@8.10.0 build --source-dir extension --artifacts-dir dist --overwrite-dest
          mv dist/*.zip "dist/qr-wifi-rs-browser-extension-${version}-unsigned.zip"

      - name: Upload extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: qr-wifi-rs-browser-extension-${{ github.ref_name }}
          path: dist/*.zip

  arch-install:
    name: Arch Linux combined archive
    needs: desktop-artifacts
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install Arch runtime and validation tools
        run: pacman -Syu --noconfirm --needed nodejs python webkit2gtk-4.1 openssl gtk3 libappindicator-gtk3 librsvg networkmanager gst-plugins-good gst-plugin-pipewire xorg-server-xvfb xorg-xauth dbus desktop-file-utils

      - name: Download Linux packages
        uses: actions/download-artifact@v8
        with:
          name: qr-wifi-rs-desktop-${{ github.ref_name }}-linux-x86_64
          path: dist

      - name: Install combined archive on Arch and launch desktop
        shell: bash
        run: |
          set -euo pipefail
          mkdir extracted
          tar -xzf dist/qr-wifi-rs-*-linux-x86_64.tar.gz -C extracted
          suite=(extracted/*)
          bash "${suite[0]}/install.sh"
          "$HOME/.local/bin/qr-wifi" --help
          desktop-file-validate "$HOME/.local/share/applications/com.thetomyou.qrwifirs.desktop"
          xvfb-run -a bash -c '"$HOME/.local/bin/qr-wifi-gui" & app=$!; sleep 5; kill -0 "$app"; result=$?; kill "$app" 2>/dev/null || true; exit "$result"'
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'

  publish-github-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli-artifacts, desktop-artifacts, extension-artifact, arch-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cd dist
          sha256sum -- * > "qr-wifi-rs-${version}-SHA256SUMS.txt"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Combined desktop + CLI + TUI + native-host installation: download qr-wifi-rs-VERSION-PLATFORM.tar.gz, extract, then run bash install.sh (macOS/Linux) or powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 (Windows). Rust is not required. See README for OS runtime prerequisites. Separate desktop-* installers remain desktop-only.
            Signing status: macOS bundles are ad-hoc signed; Windows installers and the browser extension are unsigned.
            Verify downloaded files against the versioned SHA256SUMS file.
