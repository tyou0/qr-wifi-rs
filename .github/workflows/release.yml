name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  cli-artifacts:
    name: CLI/TUI/host (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: windows-latest
            target: windows-x86_64
          - os: macos-latest
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --locked -p qr-wifi-cli -p qr-wifi-tui -p qr-wifi-host

      - name: Package release binaries
        shell: bash
        run: |
          set -euo pipefail
          package="qr-wifi-rs-${{ matrix.target }}"
          mkdir -p "dist/$package"

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp target/release/qr-wifi.exe "dist/$package/"
            cp target/release/qr-wifi-tui.exe "dist/$package/"
            cp target/release/qr-wifi-host.exe "dist/$package/"
          else
            cp target/release/qr-wifi "dist/$package/"
            cp target/release/qr-wifi-tui "dist/$package/"
            cp target/release/qr-wifi-host "dist/$package/"
          fi

          cp README.md "dist/$package/"
          if [[ -f LICENSE ]]; then cp LICENSE "dist/$package/"; fi
          tar -czf "dist/$package.tar.gz" -C dist "$package"

      - name: Upload CLI/TUI/host artifact
        uses: actions/upload-artifact@v7
        with:
          name: qr-wifi-rs-${{ matrix.target }}
          path: dist/*.tar.gz

  desktop-artifacts:
    name: Desktop bundle (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            bundles: appimage,deb
          - os: windows-latest
            target: windows-x86_64
            bundles: nsis
          - os: macos-latest
            target: macos-arm64
            bundles: app,dmg
          - os: macos-15-intel
            target: macos-x86_64
            bundles: app,dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "2.11.4"

      - name: Build desktop bundles
        run: cargo tauri build --bundles "${{ matrix.bundles }}"

      - name: Verify ad-hoc macOS signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 "target/release/bundle/macos/QR Wi-Fi RS.app"

      - name: Collect desktop artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          case "$RUNNER_OS" in
            Linux)
              cp target/release/bundle/deb/*.deb dist/
              cp target/release/bundle/appimage/*.AppImage dist/
              ;;
            Windows)
              cp target/release/bundle/nsis/*.exe dist/
              ;;
            macOS)
              ditto -c -k --sequesterRsrc --keepParent \
                "target/release/bundle/macos/QR Wi-Fi RS.app" \
                "dist/QR-Wi-Fi-RS-${{ matrix.target }}.app.zip"
              cp target/release/bundle/dmg/*.dmg \
                "dist/QR-Wi-Fi-RS-${{ matrix.target }}.dmg"
              ;;
          esac

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: qr-wifi-rs-desktop-${{ matrix.target }}
          path: dist/*

  extension-artifact:
    name: Browser extension package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint extension
        run: npx --yes web-ext@8.10.0 lint --source-dir extension --warnings-as-errors

      - name: Package unsigned extension
        run: |
          mkdir -p dist
          npx --yes web-ext@8.10.0 build --source-dir extension --artifacts-dir dist --overwrite-dest
          mv dist/*.zip dist/qr-wifi-rs-browser-extension-unsigned.zip

      - name: Upload extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: qr-wifi-rs-browser-extension
          path: dist/*.zip

  publish-github-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli-artifacts, desktop-artifacts, extension-artifact]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Signing status: macOS bundles are ad-hoc signed; Windows installers and the browser extension are unsigned.
            Verify downloaded files against checksums.txt.
