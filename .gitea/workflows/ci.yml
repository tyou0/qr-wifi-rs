name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-linux:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev ruby

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy default workspace crates
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test default workspace crates
        run: cargo test --locked

      - name: Check Tauri GUI crate
        run: cargo check --locked -p qr-wifi-gui

      - name: Check packaging metadata
        run: |
          scripts/test-release-packaging.sh
          ruby -c Formula/qr-wifi-rs.rb
          ruby -c scripts/homebrew-formula.rb
          sh -n scripts/install-native-host.sh
          sh -n scripts/test-install-native-host.sh
          sh scripts/test-install-native-host.sh
